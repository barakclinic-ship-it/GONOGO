<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12151A">
<title>אימון מהירות תגובה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12151A;
  --surface:#1B2028;
  --surface2:#242B35;
  --text:#EDEAE2;
  --text-dim:#8A93A1;
  --idle:#C9A227;
  --go:#FF3B30;
  --success:#3DDC97;
  --false:#8B7CF6;
  --border:rgba(237,234,226,0.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;padding:0;height:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:'Heebo',sans-serif;
  -webkit-user-select:none;user-select:none;
}
body{
  height:100dvh;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;}
.hidden{display:none !important;}

/* ---------- setup ---------- */
#screen-setup{padding:24px 20px;overflow-y:auto;justify-content:center;gap:28px;}
.title-block{text-align:center;}
.title-block h1{font-size:clamp(24px,7vw,30px);font-weight:900;margin:0 0 4px;letter-spacing:-0.5px;}
.title-block p{font-size:14px;color:var(--text-dim);margin:0;}
.setting-group{display:flex;flex-direction:column;gap:10px;}
.setting-label{font-size:13px;font-weight:700;color:var(--text-dim);}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  flex:1;min-width:64px;text-align:center;
  padding:12px 10px;border-radius:12px;
  background:var(--surface);border:1.5px solid var(--border);
  color:var(--text-dim);font-weight:700;font-size:15px;
  transition:all .15s ease;cursor:pointer;
}
.chip.active{background:var(--idle);border-color:var(--idle);color:#1A1508;}
.hint{font-size:12px;color:var(--text-dim);line-height:1.5;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.error-box{display:none;font-size:13px;color:var(--go);background:rgba(255,59,48,0.1);border:1px solid var(--go);border-radius:12px;padding:12px 14px;line-height:1.6;}
.btn-primary{
  width:100%;padding:18px;border:none;border-radius:16px;
  background:var(--go);color:#fff;font-size:18px;font-weight:800;
  font-family:inherit;cursor:pointer;transition:transform .1s;
}
.btn-primary:active{transform:scale(.97);}
.btn-secondary{
  padding:14px;border-radius:14px;background:var(--surface);
  border:1.5px solid var(--border);color:var(--text);font-weight:700;
  font-size:15px;font-family:inherit;cursor:pointer;
}
.btn-secondary:active{transform:scale(.97);}

/* ---------- training ---------- */
#screen-training{position:relative;background:#000;}
#video{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
#video.mirror{transform:scaleX(-1);}
.top-bar{
  position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
}
.round-pill{
  background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);
  padding:8px 16px;border-radius:100px;font-weight:800;font-size:14px;
}
.icon-btn{
  width:38px;height:38px;border-radius:100px;background:rgba(0,0,0,0.5);
  border:none;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.disc-wrap{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;
  pointer-events:none;
}
.disc{
  width:34vw;height:34vw;max-width:170px;max-height:170px;border-radius:50%;
  background:var(--idle);
  box-shadow:0 0 0 8px rgba(201,162,39,0.15);
  transition:background .08s ease, box-shadow .08s ease;
}
.disc.breathe{animation:breathe 1.8s ease-in-out infinite;}
@keyframes breathe{
  0%,100%{transform:scale(1);opacity:.75;}
  50%{transform:scale(1.08);opacity:1;}
}
.disc.go{background:var(--go);box-shadow:0 0 0 14px rgba(255,59,48,0.25);animation:none;transform:scale(1);}
.disc.caught{background:var(--success);box-shadow:0 0 0 14px rgba(61,220,151,0.25);animation:pop .3s ease;}
.disc.falsestart{background:var(--false);box-shadow:0 0 0 14px rgba(139,124,246,0.25);animation:shake .3s ease;}
@keyframes pop{0%{transform:scale(0.8);}60%{transform:scale(1.12);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
.bottom-bar{
  position:relative;z-index:3;margin-top:auto;padding:18px 20px calc(28px + env(safe-area-inset-bottom));
  text-align:center;background:linear-gradient(to top, rgba(0,0,0,0.65), transparent);
}
.instruction{font-size:17px;font-weight:700;min-height:24px;}
.timeval{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;}
.overlay-msg{
  position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;background:rgba(18,21,26,0.94);text-align:center;padding:24px;
}
.overlay-msg p{font-size:14px;color:var(--text-dim);line-height:1.6;max-width:280px;margin:0;}

/* ---------- results ---------- */
#screen-results{padding:22px 20px calc(22px + env(safe-area-inset-bottom));overflow-y:auto;gap:20px;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat-card{background:var(--surface);border-radius:14px;padding:14px 8px;text-align:center;border:1px solid var(--border);}
.stat-card .label{font-size:11px;color:var(--text-dim);font-weight:700;margin-bottom:6px;}
.stat-card .value{font-size:19px;font-weight:900;direction:ltr;}
.rounds-list{display:flex;flex-direction:column;gap:8px;}
.round-row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 14px;border:1px solid var(--border);}
.round-row .idx{width:20px;font-size:13px;color:var(--text-dim);font-weight:700;}
.round-row .bar-track{flex:1;height:8px;border-radius:6px;background:var(--surface2);overflow:hidden;}
.round-row .bar-fill{height:100%;border-radius:6px;background:var(--success);}
.round-row.fs .bar-fill{background:var(--false);width:100% !important;}
.round-row .rtime{font-size:14px;font-weight:800;direction:ltr;min-width:56px;text-align:left;}
.actions-row{display:flex;gap:10px;}
.actions-row .btn-secondary{flex:1;}
</style>
</head>
<body>

<div id="screen-setup" class="screen">
  <div class="title-block">
    <h1>מהירות תגובה</h1>
    <p>אימון תגובה בזיהוי תנועה דרך המצלמה</p>
  </div>

  <div class="setting-group">
    <div class="setting-label">מספר סבבים</div>
    <div class="chip-row" id="rounds-chips">
      <div class="chip" data-val="3">3</div>
      <div class="chip active" data-val="5">5</div>
      <div class="chip" data-val="8">8</div>
      <div class="chip" data-val="10">10</div>
    </div>
  </div>

  <div class="setting-group">
    <div class="setting-label">קצב</div>
    <div class="chip-row" id="difficulty-chips">
      <div class="chip" data-val="easy">קל</div>
      <div class="chip active" data-val="medium">בינוני</div>
      <div class="chip" data-val="hard">קשה</div>
    </div>
  </div>

  <div class="hint">עמדו מול המצלמה במרחק כ-1 מטר. העיגול צהוב = המתנה, אדום = תגיבו! זוזו (אגרוף/בעיטה/כל תנועה) מהר ככל האפשר.</div>

  <div class="error-box" id="error-box"></div>

  <button class="btn-primary" id="start-btn">התחל אימון</button>
</div>

<div id="screen-training" class="screen hidden">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="proc-canvas" width="64" height="48" style="display:none;"></canvas>

  <div class="top-bar">
    <div class="round-pill" id="round-pill">סבב 1/5</div>
    <button class="icon-btn" id="cancel-btn" aria-label="ביטול">✕</button>
  </div>

  <div class="disc-wrap"><div class="disc breathe" id="disc"></div></div>

  <div class="bottom-bar">
    <div class="instruction" id="instruction">היכונו...</div>
  </div>

  <div class="overlay-msg hidden" id="loading-overlay">
    <p id="loading-text">מבקש גישה למצלמה...</p>
  </div>
</div>

<div id="screen-results" class="screen hidden">
  <div class="title-block">
    <h1>סיכום אימון</h1>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="label">ממוצע</div><div class="value" id="stat-avg">-</div></div>
    <div class="stat-card"><div class="label">הכי מהיר</div><div class="value" id="stat-best">-</div></div>
    <div class="stat-card"><div class="label">הכי איטי</div><div class="value" id="stat-worst">-</div></div>
  </div>
  <div class="rounds-list" id="rounds-list"></div>
  <div class="actions-row">
    <button class="btn-secondary" id="share-btn">שתף תוצאה</button>
    <button class="btn-secondary" id="restart-btn">עוד סבב</button>
  </div>
  <button class="btn-primary" id="newsettings-btn" style="background:var(--surface2);">הגדרות חדשות</button>
</div>

<script>
(function(){
  var setupScreen=document.getElementById('screen-setup');
  var trainingScreen=document.getElementById('screen-training');
  var resultsScreen=document.getElementById('screen-results');

  var roundsChips=document.getElementById('rounds-chips');
  var diffChips=document.getElementById('difficulty-chips');
  var startBtn=document.getElementById('start-btn');
  var errorBox=document.getElementById('error-box');

  var video=document.getElementById('video');
  var canvas=document.getElementById('proc-canvas');
  var ctx=canvas.getContext('2d',{willReadFrequently:true});
  var disc=document.getElementById('disc');
  var instruction=document.getElementById('instruction');
  var roundPill=document.getElementById('round-pill');
  var cancelBtn=document.getElementById('cancel-btn');
  var loadingOverlay=document.getElementById('loading-overlay');
  var loadingText=document.getElementById('loading-text');

  var rounds=5;
  var difficulty='medium';
  var DELAY_RANGES={easy:[2200,3800],medium:[1300,3200],hard:[600,2200]};

  roundsChips.addEventListener('click',function(e){
    var chip=e.target.closest('.chip'); if(!chip) return;
    Array.prototype.forEach.call(roundsChips.children,function(c){c.classList.remove('active');});
    chip.classList.add('active'); rounds=parseInt(chip.dataset.val,10);
  });
  diffChips.addEventListener('click',function(e){
    var chip=e.target.closest('.chip'); if(!chip) return;
    Array.prototype.forEach.call(diffChips.children,function(c){c.classList.remove('active');});
    chip.classList.add('active'); difficulty=chip.dataset.val;
  });

  var stream=null;
  var facing='user';
  var rafId=null;
  var lastLuma=null;
  var lastDiff=0;
  var phase='idle';
  var calibSamples=[];
  var threshold=8;
  var aborted=false;
  var audioCtx=null;

  function sleep(ms){return new Promise(function(res){setTimeout(res,ms);});}

  function beep(freq,dur,type){
    try{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      var o=audioCtx.createOscillator(); var g=audioCtx.createGain();
      o.type=type||'sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0.15,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur/1000);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime+dur/1000);
    }catch(e){}
  }
  function vibrate(pattern){ if(navigator.vibrate){ navigator.vibrate(pattern); } }

  function cameraSupportError(){
    var isSecure=window.isSecureContext;
    var proto=location.protocol;
    if(proto!=='https:' && proto!=='http:'){
      return 'הדף נפתח כקובץ מקומי ולא דרך אתר (כתובת שמתחילה ב-'+proto+' ולא ב-https://). במצב הזה הדפדפן חוסם גישה למצלמה מראש ולא מציג בקשת הרשאה בכלל. יש להעלות את הקובץ לאחסון עם HTTPS (למשל GitHub Pages) ולפתוח אותו משם בכתובת https://, לא על ידי פתיחת הקובץ שהורדתם.';
    }
    if(proto==='http:' && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
      return 'הדף נטען בחיבור לא מאובטח (http). גישה למצלמה דורשת כתובת HTTPS (או localhost).';
    }
    if(!isSecure){
      return 'הדף לא נטען כ"הקשר מאובטח" (secure context), כך שהדפדפן חוסם גישה למצלמה. יש לפתוח את האתר בכתובת https:// אמיתית.';
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      return 'הדפדפן הזה לא תומך בגישה למצלמה מהדף, או שהתכונה מנוטרלת. נסו דפדפן אחר (Chrome/Safari מעודכן).';
    }
    return null;
  }

  async function startCamera(){
    var supportErr=cameraSupportError();
    if(supportErr){ var e=new Error(supportErr); e.friendly=true; throw e; }
    if(stream){ stream.getTracks().forEach(function(t){t.stop();}); }
    var constraints={video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false};
    try{
      stream=await navigator.mediaDevices.getUserMedia(constraints);
    }catch(err){
      var friendly;
      if(err.name==='NotAllowedError' || err.name==='PermissionDeniedError'){
        friendly='הגישה למצלמה נחסמה. פתחו את הגדרות האתר בדפדפן, אשרו הרשאת מצלמה, ורעננו את הדף.';
      } else if(err.name==='NotFoundError' || err.name==='DevicesNotFoundError'){
        friendly='לא נמצאה מצלמה במכשיר הזה.';
      } else if(err.name==='NotReadableError' || err.name==='TrackStartError'){
        friendly='המצלמה תפוסה על ידי אפליקציה אחרת. סגרו אותה ונסו שוב.';
      } else if(err.name==='OverconstrainedError'){
        facing='user';
        try{ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
        catch(err2){ friendly='לא ניתן להפעיל את המצלמה במכשיר הזה.'; }
      } else {
        friendly='לא ניתן לגשת למצלמה ('+(err.name||'שגיאה')+'). ודאו הרשאות ונסו שוב.';
      }
      if(!stream){ var e2=new Error(friendly); e2.friendly=true; throw e2; }
    }
    video.srcObject=stream;
    video.classList.toggle('mirror',facing==='user');
    await video.play();
  }

  function computeDiff(){
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    var frame=ctx.getImageData(0,0,canvas.width,canvas.height).data;
    var n=canvas.width*canvas.height;
    var luma=new Uint8ClampedArray(n);
    for(var i=0,p=0;i<frame.length;i+=4,p++){
      luma[p]=(frame[i]+frame[i+1]+frame[i+2])/3;
    }
    var diff=0;
    if(lastLuma){
      var sum=0;
      for(var j=0;j<n;j++){ sum+=Math.abs(luma[j]-lastLuma[j]); }
      diff=sum/n;
    }
    lastLuma=luma;
    return diff;
  }

  function detectTick(){
    if(video.readyState>=2){
      var d=computeDiff();
      lastDiff=d;
      if(phase==='calibrate'){
        calibSamples.push(d);
      } else if(phase==='wait'){
        if(d>threshold && window.__onFalseStart){
          var fn=window.__onFalseStart; window.__onFalseStart=null; phase='idle'; fn();
        }
      } else if(phase==='go'){
        if(d>threshold && window.__onCaught){
          var fn2=window.__onCaught; window.__onCaught=null; phase='idle'; fn2();
        }
      }
    }
    rafId=requestAnimationFrame(detectTick);
  }

  function fmtSec(ms){ return (ms/1000).toFixed(3)+' s'; }

  var results=[];

  async function runCalibration(){
    lastLuma=null;
    calibSamples=[];
    phase='calibrate';
    await sleep(700);
    phase='idle';
    var maxS=calibSamples.length? Math.max.apply(null,calibSamples):0;
    threshold=Math.max(6,Math.min(40,maxS*1.7+4));
  }

  function setDisc(cls){
    disc.className='disc';
    if(cls) disc.classList.add(cls);
  }

  async function runRound(idx,total){
    roundPill.textContent='סבב '+idx+'/'+total;
    instruction.textContent='היכונו...';
    setDisc('breathe');
    await runCalibration();
    if(aborted) return null;

    var range=DELAY_RANGES[difficulty];
    var delay=range[0]+Math.random()*(range[1]-range[0]);

    setDisc('breathe');
    phase='wait';
    var falseStarted=false;
    var falseStartPromise=new Promise(function(res){ window.__onFalseStart=function(){falseStarted=true;res();}; });
    var waitPromise=sleep(delay);
    await Promise.race([waitPromise,falseStartPromise]);
    window.__onFalseStart=null;

    if(aborted) return null;

    if(falseStarted){
      phase='idle';
      setDisc('falsestart');
      instruction.textContent='התחלה מוקדמת! חכו לאיתות';
      beep(200,180,'sawtooth');
      vibrate([30,40,30]);
      await sleep(1300);
      return {falseStart:true};
    }

    // GO
    setDisc('go');
    instruction.textContent='עכשיו!';
    beep(880,110,'square');
    vibrate(40);
    var t0=performance.now();
    phase='go';
    var caughtPromise=new Promise(function(res){ window.__onCaught=res; });
    var timeoutPromise=sleep(3000).then(function(){return 'timeout';});
    var raceResult=await Promise.race([caughtPromise,timeoutPromise]);
    window.__onCaught=null;
    if(aborted) return null;

    if(raceResult==='timeout'){
      phase='idle';
      instruction.textContent='לא זוהתה תנועה';
      setDisc('breathe');
      await sleep(1000);
      return {timeout:true};
    }

    var reaction=performance.now()-t0;
    phase='idle';
    setDisc('caught');
    var txt=fmtSec(reaction);
    instruction.innerHTML='זמן תגובה: <span class="timeval" dir="ltr">'+txt+'</span>';
    beep(1200,90,'sine');
    vibrate(20);
    await sleep(1100);
    return {time:reaction};
  }

  async function runTraining(){
    aborted=false;
    results=[];
    for(var i=1;i<=rounds;i++){
      var r=await runRound(i,rounds);
      if(aborted) return;
      results.push(r);
    }
    showResults();
  }

  function showResults(){
    stopCamera();
    trainingScreen.classList.add('hidden');
    resultsScreen.classList.remove('hidden');

    var validTimes=results.filter(function(r){return r && r.time;}).map(function(r){return r.time;});
    var fsCount=results.filter(function(r){return r && r.falseStart;}).length;

    var avg=validTimes.length? validTimes.reduce(function(a,b){return a+b;},0)/validTimes.length : 0;
    var best=validTimes.length? Math.min.apply(null,validTimes):0;
    var worst=validTimes.length? Math.max.apply(null,validTimes):0;

    document.getElementById('stat-avg').textContent=validTimes.length? fmtSec(avg):'-';
    document.getElementById('stat-best').textContent=validTimes.length? fmtSec(best):'-';
    document.getElementById('stat-worst').textContent=validTimes.length? fmtSec(worst):'-';

    var list=document.getElementById('rounds-list');
    list.innerHTML='';
    var maxTime=worst||1;
    results.forEach(function(r,i){
      var row=document.createElement('div');
      row.className='round-row';
      var idx=document.createElement('div'); idx.className='idx'; idx.textContent=(i+1);
      var track=document.createElement('div'); track.className='bar-track';
      var fill=document.createElement('div'); fill.className='bar-fill';
      var tval=document.createElement('div'); tval.className='rtime';
      if(r && r.time){
        fill.style.width=Math.max(6,(r.time/maxTime)*100)+'%';
        tval.textContent=fmtSec(r.time);
      } else if(r && r.falseStart){
        row.classList.add('fs');
        tval.textContent='מוקדם';
      } else {
        row.classList.add('fs');
        tval.textContent='פספוס';
      }
      track.appendChild(fill);
      row.appendChild(idx); row.appendChild(track); row.appendChild(tval);
      list.appendChild(row);
    });

    window.__lastResults={avg:avg,best:best,worst:worst,fsCount:fsCount,rounds:rounds,validCount:validTimes.length};
  }

  function stopCamera(){
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; }
    phase='idle';
  }

  startBtn.addEventListener('click',async function(){
    errorBox.style.display='none';
    setupScreen.classList.add('hidden');
    trainingScreen.classList.remove('hidden');
    loadingOverlay.classList.remove('hidden');
    loadingText.textContent='מבקש גישה למצלמה...';
    try{
      await startCamera();
      loadingOverlay.classList.add('hidden');
      detectTick();
      runTraining();
    }catch(err){
      trainingScreen.classList.add('hidden');
      setupScreen.classList.remove('hidden');
      errorBox.style.display='block';
      errorBox.textContent=(err && err.friendly)? err.message : 'לא ניתן לגשת למצלמה. יש לאשר הרשאת מצלמה בדפדפן, ואז לנסות שוב.';
    }
  });

  cancelBtn.addEventListener('click',function(){
    aborted=true;
    stopCamera();
    trainingScreen.classList.add('hidden');
    setupScreen.classList.remove('hidden');
  });

  document.getElementById('restart-btn').addEventListener('click',async function(){
    resultsScreen.classList.add('hidden');
    trainingScreen.classList.remove('hidden');
    try{
      await startCamera();
      detectTick();
      runTraining();
    }catch(err){
      trainingScreen.classList.add('hidden');
      setupScreen.classList.remove('hidden');
      errorBox.style.display='block';
      errorBox.textContent=(err && err.friendly)? err.message : 'לא ניתן לגשת למצלמה. נסו שוב.';
    }
  });

  document.getElementById('newsettings-btn').addEventListener('click',function(){
    resultsScreen.classList.add('hidden');
    setupScreen.classList.remove('hidden');
  });

  document.getElementById('share-btn').addEventListener('click',async function(){
    var d=window.__lastResults;
    if(!d) return;
    var txt='אימון מהירות תגובה 🥋\nסבבים: '+d.rounds+' (תקינים: '+d.validCount+')\n'+
      'ממוצע: '+(d.avg? (d.avg/1000).toFixed(3):'-')+' שניות\n'+
      'הכי מהיר: '+(d.best? (d.best/1000).toFixed(3):'-')+' שניות\n'+
      'התחלות מוקדמות: '+d.fsCount;
    if(navigator.share){
      try{ await navigator.share({title:'תוצאת אימון תגובה',text:txt}); }catch(e){}
    } else {
      try{
        await navigator.clipboard.writeText(txt);
        var btn=document.getElementById('share-btn');
        var orig=btn.textContent;
        btn.textContent='הועתק!';
        setTimeout(function(){btn.textContent=orig;},1500);
      }catch(e){}
    }
  });

  window.addEventListener('pagehide',stopCamera);
  window.addEventListener('beforeunload',stopCamera);
})();
</script>
</body>
</html>
